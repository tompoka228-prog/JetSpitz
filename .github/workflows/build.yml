name: Build Forge Mod

on:
  workflow_dispatch: # Запуск вручную по кнопке
  push:              # И автоматический запуск при загрузке новых файлов

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачиваем файлы из репозитория
        uses: actions/checkout@v4

      - name: Настраиваем Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21' # Поменяй на '21', если мод для Minecraft 1.20.5+
          distribution: 'temurin'

      - name: Распаковываем и объединяем архивы
        run: |
          mkdir workspace
          unzip -q -o forge-1.21.1-52.1.20-mdk.zip -d workspace/
          rm -rf workspace/src
          unzip -q -o JetSpitz-Forge-1.21.1-52.1.20-FIXED-PROJECT.zip -d workspace/

      - name: Собираем мод
        working-directory: ./workspace
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Сохраняем готовый JAR
        uses: actions/upload-artifact@v4
        with:
          name: compiled-mod
          path: workspace/build/libs/*.jar
